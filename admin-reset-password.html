<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Admin Password - GetInTouch24</title>

    <!-- Bootstrap CSS -->
    <link href="css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- Custom CSS (same as AdminLogin, taaki loader/styling match ho) -->
    <link rel="stylesheet" href="css/admin-login.css">

</head>

<body>

    <div class="login-container">

        <div class="card shadow login-card">

            <h3 class="text-center title">GetInTouch24</h3>
            <p class="text-center subtitle">Reset Admin Password</p>

            <form id="adminResetForm">

                <div class="mb-3">
                    <label class="form-label">OTP</label>
                    <input type="text" class="form-control" id="otp" placeholder="Enter OTP" maxlength="6">
                </div>

                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="newPassword" placeholder="New Password">
                        <button class="btn btn-outline-secondary" type="button" id="toggleNewPassword">
                            <i class="fa fa-eye" id="toggleNewPasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password">
                        <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                            <i class="fa fa-eye" id="toggleConfirmPasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="text-danger mb-2" id="errorMsg"></div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Update Password</button>
                </div>

                <div class="text-center mt-3">
                    <a href="AdminLogin.html" class="text-decoration-none">Back to Login</a>
                </div>

            </form>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="js/config.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/bootstrap.bundle.js"></script>
    <!-- Custom JS -->
    <script src="js/admin-reset-password.js"></script>

</body>

</html>
