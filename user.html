<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Manage Users</title>

    <link href="css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        td,
        th {
            white-space: nowrap;
        }

        td:nth-child(9),
        th:nth-child(9) {
            min-width: 220px;
        }

        td:nth-child(4) {
            word-break: break-all;
        }
    </style>

</head>

<body>

    <div class="container mt-4">

        <h3 class="mb-4">Manage Users</h3>

        <!-- ================= CREATE USER ================= -->

        <div class="card mb-4">

            <div class="card-header">
                Create User
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4 mb-2">

                        <label>Username</label>
                        <input type="text" id="username" class="form-control">

                    </div>

                    <div class="col-md-4 mb-2">

                        <label>Email</label>
                        <input type="email" id="email" class="form-control">

                    </div>

                    <div class="col-md-4 mb-2">

                        <label>Password</label>
                        <div class="input-group">
                            <input type="password" id="password" class="form-control">
                            <button class="btn btn-outline-secondary" type="button" id="toggleCreatePassword">
                                <i class="fa fa-eye" id="toggleCreatePasswordIcon"></i>
                            </button>
                        </div>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-2">

                        <label>Full Name</label>
                        <input type="text" id="fullName" class="form-control">

                    </div>

                    <div class="col-md-4 mb-2">

                        <label>Phone</label>
                        <input type="text" id="phone" class="form-control">

                    </div>

                    <div class="col-md-4 mb-2">

                        <label>Role</label>

                        <select id="role" class="form-control">

                            <option value="USER">
                                USER
                            </option>

                            <option value="ADMIN">
                                ADMIN
                            </option>

                        </select>

                    </div>

                </div>

                <button class="btn btn-primary mt-3" onclick="createUser()">

                    Create User

                </button>

            </div>

        </div>

        <!-- ================= USER LIST ================= -->

        <div class="card">

            <div class="card-header">
                User List
            </div>

            <!-- ===== ACTIVE / INACTIVE FILTER BUTTONS ===== -->
            <div class="p-3 pb-0 d-flex gap-2">
                <button type="button" id="btnActiveFilter" class="btn btn-success" onclick="loadActiveUsers(0)">
                    Active
                </button>
                <button type="button" id="btnInactiveFilter" class="btn btn-outline-danger"
                    onclick="loadInactiveUsers(0)">
                    Inactive
                </button>
            </div>

            <div class="card-body">
                <div class="table-responsive">

                    <table class="table table-bordered text-break">

                        <thead>

                            <tr>

                                <th>Sr No</th>
                                <th>User ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Full Name</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="userTableBody">
                        </tbody>

                    </table>
                </div>

                <!-- ===== PAGINATION ===== -->
                <div class="d-flex justify-content-between align-items-center mt-3">

                    <div id="paginationInfo" class="text-muted small">
                    </div>

                    <nav>
                        <ul class="pagination mb-0" id="paginationControls">
                        </ul>
                    </nav>

                </div>

            </div>

        </div>

    </div>

    <!-- ================= EDIT MODAL ================= -->

    <div class="modal fade" id="editUserModal">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5>Edit User</h5>

                    <button class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <input type="hidden" id="editUserId">

                    <label>Username</label>
                    <input type="text" id="editUsername" class="form-control mb-2">

                    <label>Email</label>
                    <input type="email" id="editEmail" class="form-control mb-2">

                    <label>Full Name</label>
                    <input type="text" id="editFullName" class="form-control mb-2">

                    <label>Phone</label>
                    <input type="text" id="editPhone" class="form-control mb-2">

                    <div class="form-check mt-2">

                        <input class="form-check-input" type="checkbox" id="editEnabled">

                        <label>
                            Enabled
                        </label>

                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-success" onclick="updateUser()">

                        Update User

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/role-config.js"></script>
    <script src="js/admin-auth.js"></script>
    <script>
        // 🆕 YE GUARD ADD KARO — sirf SUPER_ADMIN ye page access kare
        if (!isSuperAdmin()) {
            document.body.innerHTML =
                "<div style='padding:60px;text-align:center;color:#c0392b;font-size:20px;'>" +
                "🚫 You don't have access of the page." +
                "</div>";
            throw new Error("Access denied - not super admin");
        }
    </script>
    <script src="js/user.js"></script>

</body>

</html>
